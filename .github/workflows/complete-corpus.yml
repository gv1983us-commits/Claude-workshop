name: Complete Claude technical corpus

on:
  push:
    paths:
      - tools/complete_cdts_corpus.py
      - .github/workflows/complete-corpus.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Promote corpus to six of six
        run: python tools/complete_cdts_corpus.py

      - name: Validate completed corpus
        run: |
          python -m json.tool TECHNICAL_ARTIFACTS.json >/dev/null
          python -m compileall -q tests
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Prepare pushable state
        run: rm tools/complete_cdts_corpus.py

      - name: Commit completed corpus
        run: |
          git config user.name "Experimental Harmony"
          git config user.email "gv1983us@gmail.com"
          git add -A
          git commit -m "corpus: complete all six Claude technical artifacts"
          git push origin HEAD:main
