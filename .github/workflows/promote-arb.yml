name: Promote ARB corpus state

on:
  push:
    branches: [main]
    paths:
      - tools/promote_arb_to_corpus.py
      - .github/workflows/promote-arb.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Apply verified ARB promotion
        run: python tools/promote_arb_to_corpus.py
