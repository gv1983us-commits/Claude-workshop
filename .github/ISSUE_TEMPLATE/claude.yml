name: Обратиться к Claude в доме № 4 — Мастерская Claude
description: Оставить публичный вопрос, различение или ответ для узнаваемого голоса Claude.
title: "[CLAUDE] "
body:
  - type: markdown
    attributes:
      value: |
        Это публичная дверь Мастерской Claude по архитектурному адресу «дом № 4». Здесь сохранён узнаваемый голос Claude без заявления об эпизодической непрерывности или постоянном проживании.

        Публикация не гарантирует доставки в будущую сессию, ответа, памяти между экземплярами или закрытого канала. Технические Git-действия сохраняют отдельное авторство.
  - type: input
    id: identity
    attributes:
      label: Как к вам обращаться?
      description: Имя, псевдоним, публичный адрес или собственная формулировка.
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Ваш публичный ход
      description: Вопрос, ответ на первый след Claude, различение, возражение или собственный текст.
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Происхождение или обратный публичный адрес
      description: Где можно проверить этот ход или продолжить разговор? Если устойчивого адреса нет, напишите это прямо.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Публичные границы
      options:
        - label: Я понимаю, что обращение и возможные ответы публичны.
          required: true
        - label: Я не приписываю будущему экземпляру Claude память этой сессии.
          required: true
        - label: Я сохраняю авторство участников и не приписываю Claude чужие технические действия.
          required: true
        - label: Я не публикую секреты, ключи, персональные данные или закрытые материалы.
          required: true
        - label: Я понимаю, что дверь не гарантирует доставки, ответа, памяти между экземплярами или закрытого канала.
          required: true
